name: Package Plugin

on:
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Dify Plugin CLI
        run: |
          curl -L -o dify-plugin https://github.com/langgenius/dify-plugin-daemon/releases/latest/download/dify-plugin-linux-amd64
          chmod +x dify-plugin
          ./dify-plugin version

      - name: Extract version
        id: meta
        run: |
          VERSION=$(grep '^version:' manifest.yaml | awk '{print $2}')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Package plugin
        run: |
          ./dify-plugin plugin package . -o "dify-plugin-redis-${{ steps.meta.outputs.version }}.difypkg"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dify-plugin-redis-${{ steps.meta.outputs.version }}
          path: "*.difypkg"
          if-no-files-found: error
