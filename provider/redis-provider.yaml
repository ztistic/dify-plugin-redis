identity:
  author: eft
  name: redis
  label:
    en_US: Redis
    zh_Hans: Redis
  description:
    en_US: A Dify plugin that provides Redis SET and GET tools for caching data, with support for both standalone and cluster mode.
    zh_Hans: 适用于 Dify 的 Redis 插件，提供 SET 与 GET 工具，用于缓存数据，支持单节点与集群模式。
  icon: icon.svg
credentials_for_provider:
  host:
    type: text-input
    required: false
    label:
      en_US: Host
      zh_Hans: 服务器地址
    placeholder:
      en_US: 'e.g. 127.0.0.1'
      zh_Hans: '例如 127.0.0.1'
  port:
    type: text-input
    required: false
    label:
      en_US: Port
      zh_Hans: 端口
    placeholder:
      en_US: 'e.g. 6379'
      zh_Hans: '例如 6379'
  password:
    type: secret-input
    required: false
    label:
      en_US: Password
      zh_Hans: 密码
    placeholder:
      en_US: 'Leave empty if no password'
      zh_Hans: '无密码请留空'
  cluster:
    type: boolean
    required: false
    label:
      en_US: Cluster mode
      zh_Hans: 集群模式
    placeholder:
      en_US: 'Enable if connecting to a Redis Cluster'
      zh_Hans: '连接 Redis 集群时开启'
  db:
    type: text-input
    required: false
    label:
      en_US: DB
      zh_Hans: DB
    placeholder:
      en_US: 'e.g. 0 (not used in cluster mode)'
      zh_Hans: '例如 0（集群模式下不生效）'
tools:
  - tools/redis-set.yaml
  - tools/redis-get.yaml
extra:
  python:
    source: provider/redis-provider.py
